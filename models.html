tton class="ss-link" id="mix-raise">選Raise</button><button class="ss-link" id="mix-fold">選Fold</button><button class="ss-link" id="mix-sample">獨立抽籤示範100次</button><button class="ss-link" id="mix-new">開始新一組</button></div><div id="mix-report" role="status"></div><p>抽樣會自然波動；本工具不做顯著性或精熟認證。</p></section><footer><a href="training.html">回到訓練</a> · 紀錄可從首頁備份。</footer></main><script src="assets/models.275b93a2d3.js"></script><script src="assets/register-sw.2b7d99ce07.js"></script></body></html>
