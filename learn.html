 "goal": "先理解範圍，再透過互動掌握 GTO、均衡、混合策略、比例與針對性調整。", "why": "範圍是策略的單位；理解 GTO 的模型與限制，才不會把圖表百分比當成任何牌局都通用的答案。", "skills": ["範圍、位置與組合數", "GTO 與納許均衡", "平衡、混合頻率與 EV", "三種比例與 MDF 限制", "阻擋牌、Solver 條件與針對性調整"], "icon": "▦"}, {"title": "勝率與賠率", "goal": "分清贏的機率、跟注的價格，以及未來看牌的成本。", "why": "不是牌強就要跟、不到五成就要棄；需要把機會與價格放在一起比較。", "skills": ["底池賠率", "Outs 與抽牌", "勝率實現"], "icon": "◔"}, {"title": "下注的目的", "goal": "先說出動作的目的，再選擇金額。", "why": "下注不是為了顯得強勢；過牌、下注與加注都會創造不同的風險與收益。", "skills": ["Check 與 Bet", "完整加注規則", "BB 與底池百分比"], "icon": "↗"}, {"title": "翻牌前策略", "goal": "辨認未開池與已加注的情境，理解有效籌碼。", "why": "翻牌前的範圍與尺寸會決定後續底池大小、位置與決策空間。", "skills": ["首次開池條件", "3-bet 的意思", "有效籌碼與 SPR"], "icon": "◇"}, {"title": "翻牌策略", "goal": "把自己的牌放進牌面與雙方範圍中看。", "why": "翻牌前的強牌不保證現在領先；公共牌會重新排列成牌與聽牌的可能性。", "skills": ["乾燥與連結牌面", "持續下注", "下注與過牌的理由"], "icon": "▱"}, {"title": "轉牌策略", "goal": "新的一張牌出現後，重新評估範圍與後續計畫。", "why": "沿用上一街的答案很容易忽略已完成的聽牌、新風險與剩餘籌碼。", "skills": ["範圍更新", "第二槍", "看一張或兩張的成本"], "icon": "↻"}, {"title": "河牌策略", "goal": "用明確模型比較跟注、詐唬與價值下注的期望值。", "why": "沒有下一張牌可以改善，最後的決策更需要分清範圍、價格與對手反應。", "skills": ["跟注 EV", "純詐唬門檻", "價值下注 vs. 過牌"], "icon": "✧"}];const L=[{"m": 0, "title": "一手牌怎麼走完？", "kind": "streets", "pred": "公共牌還沒發完，可以贏得底池嗎？", "po": ["可以，對手全部棄牌時", "不行，必須攤牌"], "pa": 0, "q": "翻牌圈結束後，下一個階段是？", "opts": ["立刻攤牌", "發轉牌，再進行下注", "重新發手牌"], "ans": 1, "principle": "先知道目前是哪一街，再判斷有哪些資訊。", "explain": "翻牌前 → 翻牌（三張公共牌）→ 轉牌（第四張）→ 河牌（第五張）。若其他人全棄牌，最後未棄牌者可以提早贏得底池。", "bound": ""}, {"m": 0, "title": "七張牌，只取最佳五張", "kind": "showdown", "pred": "兩張手牌一定都要使用嗎？", "po": ["一定", "不一定，可以用零、一或兩張"], "pa": 1, "q": "公共牌已是 A♠ K♠ Q♠ J♠ T♠。你拿 2♥ 2♦，對手拿 A♥ A♦，誰贏？", "opts": ["對手", "你", "平手"], "ans": 2, "principle": "比較最佳五張，不只比較兩張手牌。", "explain": "雙方可用公共牌組成相同的皇家同花順，因此平手分池。一般德州撲克不像奧馬哈，不要求使用恰好兩張手牌。", "bound": ""}, {"m": 0, "title": "牌型、踢腳與平手", "kind": "ranking", "pred": "兩人都是一對，是否一定平手？", "po": ["是", "不是，還要比點數與踢腳"], "pa": 1, "q": "A A K Q 9 與 A A K J T 都是一對 A，誰贏？", "opts": ["A A K Q 9", "A A K J T", "平手"], "ans": 0, "principle": "同牌型，依序比較構成最佳五張的點數。", "explain": "對子相同，先比最高踢腳 K，再比 Q 與 J，所以第一手獲勝。花色不決定一般攤牌勝負。", "bound": ""}, {"m": 1, "title": "翻牌前與翻牌後的順序", "kind": "position", "pred": "SB 在每一街都先行動嗎？", "po": ["是", "不是，翻牌前不是"], "pa": 1, "q": "標準六人桌、無人棄牌時，翻牌前誰先行動？", "opts": ["SB", "UTG", "BTN"], "ans": 1, "principle": "先問哪一街，再看行動順序。", "explain": "翻牌前 UTG 最先；翻牌後從 BTN 左邊仍在局的人開始，全員在局時 SB 最先、BTN 最後。單挑時 BTN 兼 SB，翻牌前先、翻牌後最後。", "bound": ""}, {"m": 1, "title": "後行動，多看見什麼？", "kind": "information", "pred": "對手過牌，能確定他很弱嗎？", "po": ["可以", "不行，強牌也可能過牌"], "pa": 1, "q": "單挑翻牌後你在 BTN，對手過牌，代表？", "opts": ["他一定沒牌", "你多知道一個行動，但不知道確切手牌", "你一定得下注"], "ans": 1, "principle": "資訊是一個線索，不是確定答案。", "explain": "有位置者在對手過牌後也過牌，可以結束這一街；也可下注，讓對手重新決策。位置帶來更多資訊與控制選項。", "bound": ""}, {"m": 2, "title": "範圍與手牌組合", "kind": "range", "pred": "AA、AKs、AKo 各一格，代表組合數一樣嗎？", "po": ["一樣", "不一樣"], "pa": 1, "q": "AKs 與 AKo 的 s／o 代表？", "opts": ["同花／不同花", "強／弱", "小盲／大盲"], "ans": 0, "principle": "一格不是一組；範圍也不是確切手牌。", "explain": "未知牌完整時，AA 有 6 組、AKs 有 4 組、AKo 有 12 組；已知牌會減少組合。範圍也可對各組合配置不同頻率。", "bound": "手工矩陣只示範範圍形狀，不是 GTO 或推薦開池表。"}, {"m": 2, "title": "為什麼位置改變範圍？", "kind": "range", "pred": "所有位置使用同一開池圖好嗎？", "po": ["好，簡單就正確", "不好，待行動人數與後續位置不同"], "pa": 1, "q": "前面全棄牌，BTN 為何可能比 UTG 開更多牌？", "opts": ["待行動對手較少，翻牌後常有位置", "手牌自動變大", "每手都該加注"], "ans": 0, "principle": "位置改變的是情境價值，不是牌面點數。", "explain": "BTN 後只剩盲位，且翻牌後有位置；UTG 後面仍有更多人。尺寸、抽水、籌碼與對手都會改變具體範圍。", "bound": "僅示範 UTG／CO／BTN；SB、BB 的結構不同，不能線性外推。"}, {"m": 2, "title": "GTO 是什麼：從可預測到均衡", "kind": "gto_equilibrium", "pred": "只要採用 GTO，每一手都會贏嗎？", "po": ["會，最佳策略就必勝", "不會，策略期望與單次結果不同"], "pa": 1, "q": "關於 GTO，哪個描述最正確？", "opts": ["每手都選最兇的動作", "在指定模型的均衡中，沒有人能單方面改策略提高自己的期望收益", "專門抓弱玩家的策略"], "ans": 1, "principle": "GTO 是整套策略的均衡，不是每手必勝的答案。", "explain": "GTO＝Game Theory Optimal，常指符合納許均衡概念的策略。以雙人零和模型說明時，均衡策略不讓對手靠針對偏差提高其均衡收益，但不保證你每手獲勝，也不一定最大化對每位弱玩家的收益。多人、抽水及 ICM 的結構必須另外分析。", "bound": "剪刀石頭布只示範均衡概念，不等於完整 Poker 求解。零和、不被剝削的結論不可直接擴張到多人或不同效用模型。"}, {"m": 2, "title": "平衡範圍：為什麼需要價值牌與詐唬", "kind": "gto_balance", "pred": "平衡是不是任何時候都該一半價值、一半詐唬？", "po": ["是，50/50 最平衡", "不是，比例與尺寸及模型有關"], "pa": 1, "q": "簡化河牌模型：下注半池時，讓抓詐唬牌跟注打平的下注範圍詐唬占比？", "opts": ["25%", "33.3%", "50%"], "ans": 0, "principle": "平衡不是五五開；它讓特定對手決策無差異。", "explain": "在此單挑河牌極化模型，價值牌一定贏過抓詐唬牌、詐唬一定輸：下注範圍詐唬占比＝B/(P+2B)。半池下注時為 25%，價值:詐唬＝3:1。這是「已下注範圍中的占比」，不是所有空氣牌都要以 25% 頻率下注。", "bound": "河牌單挑、無加注、不計抽水、價值牌必贏與詐唬必輸。此比例不直接適用翻牌、轉牌或任意實戰範圍。"}, {"m": 2, "title": "混合策略：70/30 不是看心情", "kind": "gto_mixing", "pred": "畫面說加注 30%、跟注 70%，表示加注比較差嗎？", "po": ["是，較少就較差", "不一定，均衡內混合動作理論 EV 相同"], "pa": 1, "q": "精確均衡中，同一手牌真正混合兩個動作時，兩者 EV 應如何？", "opts": ["相同；數值求解可能有誤差", "高頻動作必定更高", "一定相差很大"], "ans": 0, "principle": "混合頻率是策略結構，不是正確率或勝率。", "explain": "精確均衡裡，對同一資訊集合真正採用的混合動作具有相同 EV，否則不會同時採用。實際 Solver 是近似解，可能有收斂、顯示精度與簡化誤差。對手偏離後，原本相同的動作可能變得不同。", "bound": "70/30 是人為練習比例，沒有對應實戰手牌或求解答案。隨機抽樣的小樣本不保證剛好達成比例；每次決策獨立，不補做動作湊次數。"}, {"m": 2, "title": "三種比例：勝率、詐唬占比與防守頻率", "kind": "gto_mdf", "pred": "半池下注的 25% 和約 66.7%，是互相矛盾嗎？", "po": ["是", "不是，分母與要解決的問題不同"], "pa": 1, "q": "MDF 約 66.7%，代表你每一手都要有 66.7% 勝率才跟嗎？", "opts": ["是", "不是，它是簡化模型下整體防守頻率的參考", "代表所有牌都要跟"], "ans": 1, "principle": "先問比例的分母是什麼，不要只背數字。", "explain": "跟注門檻 B/(P+2B) 是單手所需權益；極化下注範圍的詐唬占比在此模型數值相同但意義不同；MDF＝P/(P+B) 是防止零權益詐唬自動獲利的範圍防守頻率參考。它不指定哪些牌跟或加注，也不是所有街都應機械達成的 GTO 指令。", "bound": "MDF 模型假設對方零權益詐唬過牌價值為 0；被跟必輸，無後續成本。實戰、前兩街、價值偏重對手與 ICM 等可能不適用。"}, {"m": 2, "title": "阻擋牌：手牌如何改變對方組合", "kind": "gto_blockers", "pred": "你拿到一張 A，對手還有原本六組 AA 嗎？", "po": ["有，圖表不會變", "沒有，已知牌會排除組合"], "pa": 1, "q": "只知道你持 A♠ K♣，尚未指定其他已知牌，對手 AA 與所有 AK 剩幾組？", "opts": ["AA 6、AK 16", "AA 3、AK 9", "AA 4、AK 12"], "ans": 1, "principle": "阻擋牌是組合資訊，不是自動詐唬許可證。", "explain": "四張 A 選兩張是六組 AA；你拿走一張 A 後剩三張，AA 變三組。你同時拿走一張 A 與一張 K，AK 變 3×3＝9 組。是否適合詐唬還要看你阻擋的是對手跟注還是棄牌，以及完整範圍。", "bound": "僅枚舉牌張阻擋，未指定公共牌與行動範圍，不以組合數直接推論對手手牌機率或最優動作。"}, {"m": 2, "title": "Solver 在解什麼：答案有適用條件", "kind": "gto_model", "pred": "同一手牌，可把任何 GTO 圖套到所有牌局嗎？", "po": ["可以，GTO 是通用答案", "不可以，模型條件不同"], "pa": 1, "q": "圖表說明為六人 100 BB、前面全棄牌，但你面對 UTG 加注且只有 30 BB，應？", "opts": ["照同一格執行", "先找符合條件的情境，不能直接套用", "只看自己位置就夠"], "ans": 1, "principle": "先讀模型標籤，再看牌格顏色。", "explain" 格。", "explain": "全押或確定能免費看完時，才可直接用兩張機率比較。否則還需考慮未來下注、隱含賠率、反向隱含賠率與勝率實現。", "bound": ""}, {"m": 4, "title": "過牌不是放棄", "kind": "action", "pred": "過牌代表沒有贏牌的方式了嗎？", "po": ["是", "不是"], "pa": 1, "q": "單挑河牌，你有位置，對手已過牌，你也過牌會？", "opts": ["直接棄牌", "結束下注並攤牌", "一定輸"], "ans": 1, "principle": "過牌與下注都有機會成本。", "explain": "過牌可保留攤牌價值，也避免被過牌加注；但可能錯過較差牌願意跟注的價值。其他街還可能讓對手免費改善。", "bound": ""}, {"m": 4, "title": "下注、跟注與加注", "kind": "raise", "pred": "對手已下注，你再提高金額叫？", "po": ["Bet 下注", "Raise 加注"], "pa": 1, "q": "A 下注 20，B 加注到 60，一般完整再加注至少到？", "opts": ["80", "100", "120"], "ans": 1, "principle": "加注到的總額，不等於再增加多少。", "explain": "上次完整加注增量是 60−20＝40；下一次完整加注至少到 100。不足額全押與重開加注權是另外的規則。", "bound": "僅示範一般完整加注；不足額全押及場館例外另論。"}, {"m": 4, "title": "尺寸：BB 與底池比例", "kind": "size", "pred": "3 BB 與三倍底池是同一單位嗎？", "po": ["是", "不是"], "pa": 1, "q": "盲注 1/2，首次加注到 6，等於？", "opts": ["3 BB", "6 BB", "三倍底池"], "ans": 0, "principle": "先說清楚單位，再討論大小。", "explain": "大盲為 2，總額 6 就是 3 BB。翻牌後常用下注前底池的百分比描述下注；加注還需分清加注到、增加額與倍數。", "bound": ""}, {"m": 5, "title": "首次開池，先看條件", "kind": "range", "pred": "開池圖適用任何前面動作嗎？", "po": ["是", "否，前提不同"], "pa": 1, "q": "CO 前已有 UTG 加注，可直接套前面全棄牌的 CO 開池圖嗎？", "opts": ["可以", "不行，面對加注是另一種情境", "同花就可以"], "ans": 1, "principle": "先讀情境，再讀手牌。", "explain": "未開池與面對加注是不同問題。需要重看對方範圍、尺寸、位置、有效籌碼與後面尚未行動的玩家。", "bound": "示意範圍不提供實戰答案。"}, {"m": 5, "title": "3-bet、有效籌碼與 SPR", "kind": "spr", "pred": "3-bet 就是固定加到三倍嗎？", "po": ["是", "不是，這是下注序列的名稱"], "pa": 1, "q": "你有 100 BB，單挑對手有 40 BB，最多互相爭奪的有效籌碼？", "opts": ["140 BB", "100 BB", "40 BB"], "ans": 2, "principle": "較短的一方限制單挑可爭奪的籌碼。", "explain": "大盲算第一注、首次加注為 2-bet、再加注為 3-bet。SPR 是此時有效剩餘籌碼除以底池，不等於手牌必須打光的指令。", "bound": ""}, {"m": 6, "title": "翻牌：辨識牌面", "kind": "texture", "pred": "只看自己的兩張牌就足夠決定下注嗎？", "po": ["足夠", "還需看公共牌與範圍"], "pa": 1, "q": "一對在 J♥ T♥ 9♣ 與 A♠ 7♦ 2♣ 上可照搬策略嗎？", "opts": ["可以", "不行，結構與雙方範圍不同", "濕潤牌面必須全押"], "ans": 1, "principle": "手牌強度是相對的，不是固定標籤。", "explain": "連結性、同花可能與牌面點數都會影響雙方範圍。乾燥、濕潤只是起點，不能單靠名稱決定策略。", "bound": ""}, {"m": 6, "title": "持續下注不是自動按鈕", "kind": "action", "pred": "翻牌前加注後，翻牌一定要下注嗎？", "po": ["一定", "不一定"], "pa": 1, "q": "你翻牌前加注、翻牌沒中，最合理原則？", "opts": ["每次下注", "每次過牌", "依範圍、牌面、位置與對手決定"], "ans": 2, "principle": "每一次下注，都要說明對誰、想達成什麼。", "explain": "持續下注是前街進攻者在下一街下注，不是義務。下注可能取價值、詐唬或拒絕勝率；過牌可能保留攤牌價值並保護過牌範圍。", "bound": ""}, {"m": 7, "title": "轉牌：更新可能性", "kind": "turn", "pred": "看起來危險的轉牌一定只對你不利嗎？", "po": ["一定", "不一定，看它連結誰的範圍"], "pa": 1, "q": "翻牌兩張紅心、轉牌第三張紅心，代表？", "opts": ["對手一定同花", "同花成為可能，應更新範圍", "所有一對都沒價值"], "ans": 1, "principle": "更新假設，不要延續上一街的情緒。", "explain": "新牌改變成牌、聽牌與相對優勢，但不會揭露對手確切手牌。是否繼續下注仍需看雙方範圍與計畫。", "bound": ""}, {"m": 7, "title": "第二槍與後續計畫", "kind": "future", "pred": "有聽牌的半詐唬與河牌空氣牌詐唬相同嗎？", "po": ["完全相同", "不同，被跟後仍有改善機會"], "pa": 1, "q": "轉牌有聽牌的下注，可直接套「被跟必輸」的純詐唬公式算精確 EV 嗎？", "opts": ["可以", "不行，還有改善與河牌決策", "只要下注小就行"], "ans": 1, "principle": "下注之前，先想好被跟與被加注的分支。", "explain": "轉牌 EV 還含被跟後的權益、後續下注與有效籌碼。純河牌詐唬公式只對特定簡化模型成立。", "bound": ""}, {"m": 8, "title": "河牌跟注：價格對上範圍", "kind": "call", "pred": "河牌是否跟注，只看自己牌型嗎？", "po": ["是", "要比較對範圍的勝率與價格"], "pa": 1, "q": "原底池 120，對手下注 60，假設勝率 30%，跟注 EV？", "opts": ["−12", "0", "＋12"], "ans": 2, "principle": "先估對方的可能，再比較跟注的價格。", "explain": "最後總底池 240，EV＝0.30×240−60＝＋12。門檻 25% 不代表你真的有 25% 勝率。", "bound": "單挑河牌、無後續行動、不計抽水，勝率由你假設。"}, {"m": 8, "title": "純詐唬需要多少棄牌？", "kind": "bluff", "pred": "半池下注的跟注門檻與詐唬門檻相同嗎？", "po": ["相同", "不同，回答的問題不同"], "pa": 1, "q": "河牌底池 100，下注 50，被跟必輸，打平棄牌率？", "opts": ["25%", "33.3%", "50%"], "ans": 1, "principle": "跟注問值不值得買，詐唬問需要多少人放棄。", "explain": "EV＝F×100−(1−F)×50。打平時 F＝50/150＝33.3%，不同於跟注需要的 25%。", "bound": "純詐唬、被跟必輸、無再加注、不計抽水。棄牌率為手動假設。"}, {"m": 8, "title": "價值下注：誰會付錢？", "kind": "value", "pred": "價值下注主要想要？", "po": ["較差牌跟注", "所有人棄牌"], "pa": 0, "q": "下注後所有較差牌棄、較好牌都跟，能只因自己牌強就認定是好價值下注嗎？", "opts": ["能", "不能，要與過牌收益比較", "河牌永遠不下注"], "ans": 1, "principle": "找出會付錢的較差牌，再問要收多少。", "explain": "下注要比較過牌基準、較差牌跟注量、較好牌反應與被加注風險。模型中的正 EV 不等於下注一定比過牌好。", "bound": "二分類靜態模型：無平手、無加注、較好牌全跟。跟注率非解算結果。"}];const INTRO=[["歡迎來到牌桌", "先不急著想怎麼贏。花幾分鐘，認識這張桌上的座位、籌碼、牌與動作。這裡使用標準六人桌、盲注 1／2 的示範。", "table", "none", "這是導覽示意，不是連續的一手實戰牌局。"], ["BTN：莊家位，不一定負責發牌", "BTN 是 Button，中文稱莊家位。D 圓牌標記目前的位置，每手結束通常順時針移動一位。BTN 翻牌後通常最後行動。", "BTN", "none", "先記位置，不需要背所有英文縮寫。"], ["SB：小盲，先放入 1", "Small Blind 位於 BTN 左邊。這桌小盲為 1，是發牌前強制投入，不代表已經選擇跟注。小盲通常約為大盲的一半，實際依牌局設定。", "SB", "blind", "單挑桌有例外：BTN 同時是 SB。"], ["BB：大盲，先放入 2", "Big Blind 在 SB 左邊。本桌大盲是 2，1 BB 就等於 2 籌碼。大盲提供翻牌前的初始下注基準，仍保有行動權。", "BB", "blind", "100 BB 是籌碼單位，不代表 100 元。"], ["UTG：翻牌前第一個行動", "Under the Gun，槍口位，位於大盲左邊。六人桌翻牌前從這裡開始，後面還有五位玩家要決定。", "UTG", "pre", "前位要面對更多尚未行動的對手。"], ["HJ：中間的位置", "Hijack 在這個六人桌位於 UTG 之後、CO 之前。玩家人數改變，位置名稱與配置也會改變。", "HJ", "pre", "九人桌還可能出現 UTG+1、LJ 等名稱。"], ["CO：莊家位前一位", "Cutoff，在 BTN 之前行動。通常稱後位，但翻牌後若 BTN 仍在局，你不一定最後行動。", "CO", "pre", "位置是相對於其他仍在局的玩家。"], ["行動順序會隨街次改變", "翻牌前：UTG → HJ → CO → BTN → SB → BB。翻牌後：從 BTN 左邊仍在局的人開始；全員在局時是 SB → BB → UTG → HJ → CO → BTN。", "order", "post", "不是每一街都從同一個位置開始。"], ["手牌：只有你知道的兩張", "Hole Cards 是每人兩張私有手牌。公共牌發完後，從兩張手牌與五張公共牌裡，挑最佳五張比較；手牌可以用零、一或兩張。", "hole", "deal", "別把兩張手牌的大小，直接當成最後勝負。"], ["底池與籌碼不是同一件事", "Pot 是大家已經投入、正在爭奪的籌碼。Stack 是你面前尚未投入的籌碼。已投入底池的錢，不能因為改變心意就拿回。", "pot", "none", "這張桌的金額是教學示意，不會扣款。"], ["Fold：棄牌，退出這一手", "面對下注時，你可以棄牌。不再爭奪這一手的底池；先前已投入的籌碼留在底池。棄牌不等於本場遊戲結束。", "fold", "action", "在這個示範情境，你正在面對下注。"], ["Call：跟注，補到目前金額", "對手本街下注到 6，而你本街已投入 2，你需要再補 4 才是跟注。Call 不是每次都重新付出對手的總額。", "call", "call", "例：你是 BB，已付 2，面對加注到 6。"], ["Raise：加注，提高目前金額", "對手已下注，你再提高金額，叫 Raise。這個示例是對手下注 2，你加注到 6；不是在原金額上再加 6。", "raise", "raise", "一般完整加注增量，不得小於上一個完整下注／加注增量。"], ["Check 與 Bet：沒人下注時的選項", "本街沒人下注、你也沒有尚未補齊的金額時，可以 Check 過牌，不投入新籌碼。若選擇首先投入籌碼，叫 Bet 下注。", "check", "action", "面對未補齊的下注，不能用過牌跳過。BB 在未加注底池有過牌選項。"], ["All-in：把剩餘籌碼全部投入", "全押可能是下注、跟注或加注，取決於前面的動作。籌碼不足仍可全押，但可能產生邊池；不足額加注是否重開加注權需要另外判斷。", "allin", "raise", "不是全押的人，就能贏到對手全部的籌碼。"], ["Flop：翻牌，三張一起出現", "翻牌前一輪結束後，發出三張公共牌，大家共用。進入下一輪下注，行動順序也切換成翻牌後的順序。", "board", "flop", "每張牌的角落與中央都有花色圖示。"], ["Turn：轉牌，重新更新判斷", "第四張公共牌是轉牌。它可能完成同花、順子或讓牌面成對；上一街合理的判斷，此刻可能需要修改。", "board", "turn", "Street 指一個下注階段，不是桌上的位置。"], ["River 與 Showdown：最後一張與攤牌", "第五張公共牌叫河牌。最後一輪下注結束，仍在局的玩家比較最佳五張；這叫 Showdown 攤牌。若只剩一人， function card(c,mini=false){if(c==='?')return `<span class="pc back ${mini?'mini':''}" role="img" aria-label="尚未揭曉的牌"></span>`;const r=c[0],s=c.slice(1),rank=r==='T'?'10':r,name={'♠':'黑桃','♥':'紅心','♦':'方塊','♣':'梅花'}[s]||'';const icon=(x,y,w,h)=>suitSVG(s).replace('<svg ',`<svg x="${x}" y="${y}" width="${w}" height="${h}" `);return `<span class="pc ${/[♥♦]/.test(s)?'red':''} ${mini?'mini':''}" role="img" aria-label="${name}${rank}"><svg class="card-art" viewBox="0 0 60 86" width="60" height="86" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"><g fill="currentColor" font-family="Arial, sans-serif" font-weight="700"><text x="5" y="15" font-size="14">${rank}</text>${icon(5,18,9,10)}${icon(18,29,24,28)}<g transform="translate(60 86) rotate(180)"><text x="5" y="15" font-size="14">${rank}</text>${icon(5,18,9,10)}</g></g></svg></span>`}
function cards(cs,mini=false){return `<div class="cards">${cs.map(c=>card(c,mini)).join('')}</div>`}function rich(t){return esc(t).replace(/([AKQJT2-9][♠♥♦♣](?:\s+[AKQJT2-9][♠♥♦♣])*)|\b(AA|AKs|AKo)\b|A A K Q 9|A A K J T/g,s=>{let a=s==='AA'?['A♠','A♥']:s==='AKs'?['A♠','K♠']:s==='AKo'?['A♠','K♥']:s==='A A K Q 9'?['A♠','A♥','K♣','Q♦','9♠']:s==='A A K J T'?['A♣','A♦','K♥','J♣','T♦']:s.split(/\s+/);return `<span class="inlinecards">${a.map(c=>card(c,true)).join('')}</span>`})}
function tabs(labels,value,key){return `<div class="tabs">${labels.map((t,i)=>`<button data-${key}="${i}" class="${i===value?'on':''}">${t}</button>`).join('')}</div>`}function bindTabs(key,fn){$$('[data-'+key+']').forEach(b=>b.onclick=()=>fn(+b.getAttribute('data-'+key)))}

function tableLedger(high,mode){const paid={UTG:0,HJ:0,CO:0,BTN:0,SB:1,BB:2};let note='只有強制盲注：SB 1＋BB 2＝3。';if(['post','action','flop','turn','river'].includes(mode)){paid.BTN=6;paid.BB=6;note='BTN 加注到 6、SB 棄牌、BB 補 4 跟注：BTN 6＋SB 1＋BB 6＝13；其後過牌不改變底池。';}if(mode==='raise'||mode==='call'||high==='fold'){paid.BTN=6;paid.BB=mode==='call'?6:2;note=mode==='call'?'跟注完成：原底池 9，BB 再補 4，底池變 13。':'BTN 加注到 6，原盲注 3 加上 6＝9，BB 尚待回應。';}if(high==='fold')note='BB 面對 BTN 加注到 6；畫面為棄牌決策前，尚未退回未跟注籌碼或派彩。';if(high==='bet'){paid.BTN=10;paid.BB=6;note='原底池 13，BTN 翻牌下注 4，底池變 17，BB 尚待回應。';}if(high==='allin'){paid.BTN=200;paid.BB=2;note='BTN 全押 200，加上 SB 1、BB 2，共投入 203；含未被跟注金額，尚未結算。';}return {paid,pot:Object.values(paid).reduce((a,b)=>a+b,0),note,breakdown:Object.entries(paid).filter(([k,v])=>v).map(([k,v])=>k+' '+v).join('＋')}}
function tableHTML(high,mode,interactive=true,orderSeat=null){const ledger=tableLedger(high,mode);let n={none:0,blind:0,pre:0,post:3,deal:0,action:3,call:0,raise:0,flop:3,turn:4,river:5}[mode]??5;let board=['A♠','7♥','2♣','T♥','4♦'].map((c,i)=>i<n?c:'?');let act=['fold','call','raise','check','bet','allin'];return `<div class="table ${reduce?'':'scene-motion'}" aria-label="六人桌示意；盲注 1 與 2，投入依示例加總"> <div class="ellipse"></div>${seats.map(([s,c,x,y])=>`<div data-contribution="${ledger.paid[s]}" data-remaining="${200-ledger.paid[s]}" class="seatbox ${high===s||orderSeat===s?'active':''}" style="left:${x}%;top:${y}%"><button class="seatbtn" data-hot="${s}" ${interactive?'':'tabindex="-1"'} aria-label="${s} ${c}">${s==='BTN'?'<span class="dealer">D</span>':''}<strong>${s}</strong><small>${c}</small></button><button class="stackbtn ${high==='stack'&&s==='CO'?'hotactive':''}" data-hot="stack" ${interactive?'':'tabindex="-1"'} aria-label="${s} 剩餘籌碼"><span class="chip ${s==='BB'?'blue':''}" style="width:9px;height:9px;border-width:1px"></span>${(200-ledger.paid[s])/2} BB 剩餘</button>${s==='SB'||s==='BB'?`<span class="blindtag">${s==='SB'?'起始小盲 1':'起始大盲 2'}</span>`:''}</div>`).join('')}<button class="boardhot ${high==='board'?'hotactive':''}" data-hot="board" ${interactive?'':'tabindex="-1"'} aria-label="公共牌"><span class="hotlabel">BOARD · 公共牌</span>${cards(board)}</button><button class="pothot ${high==='pot'?'hotactive':''}" data-hot="pot" ${interactive?'':'tabindex="-1"'}><span class="chip"></span>底池 ${ledger.pot}</button><button class="holehot ${high==='hole'?'hotactive':''} ${high==='fold'?'folded':''}" data-hot="hole" ${interactive?'':'tabindex="-1"'} aria-label="你的兩張手牌，黑桃 K、紅心 Q">${cards(['K♠','Q♥'])}<span class="hotlabel">你的手牌</span></button>${mode==='blind'&&!reduce?'<span class="flyingchip" aria-hidden="true"></span><span class="flyingchip bb" aria-hidden="true"></span>':''}${(mode==='call'||mode==='raise')&&!reduce?'<span class="flyingchip payraise" aria-hidden="true"></span>':''}</div><div class="actionstrip">${act.map(a=>`<button class="actionchip ${high===a?'on':''}" data-hot="${a}" ${interactive?'':'tabindex="-1"'}>${{fold:'Fold 棄牌',call:'Call 跟注',raise:'Raise 加注',check:'Check 過牌',bet:'Bet 下注',allin:'All-in 全押'}[a]}</button>`).join('')}</div><p class="small" style="text-align:center;font-size:10px;margin:5px 0 8px">${ledger.note}<br>投入：${ledger.breakdown}＝${ledger.pot}。每人起始 200（100 BB），不計前注、抽水；動作為獨立示例。</p>`}
function renderIntro(){let a=INTRO[introIndex];$('#main').innerHTML=`<div class="row between"><span class="kicker">FIRST, GET YOUR BEARINGS</span><button class="ghost" id="skip">跳到互動牌桌 →</button></div><h1>把陌生的名詞，放回牌桌上。</h1><p class="lead">位置亮起、籌碼移動、公共牌逐步出現。你可以暫停，讓理解跟上動畫。</p><div class="introgrid"><div class="boardwrap">${tableHTML(a[2],a[3],false)}</div><section class="card introtext" aria-live="polite"><div class="row between"><span class="pill">動畫導覽</span><span class="scene-count">${introIndex+1} / ${INTRO.length}</span></div><h2 style="margin-top:18px">${a[0]}</h2><p class="caption">${rich(a[1])}</p><div class="insight small">${a[4]}</div><div class="controls"><div class="progress"><div style="width:${(introIndex+1)/INTRO.length*100}%"></div></div><div class="row between"><button class="ghost" id="prevscene" ${introIndex===0?'disabled':''}>← 上一幕</button><button class="primary" id="play">${playing?'Ⅱ 暫停':'▷ 自動播放'}</button><button class="ghost" id="nextscene">${introIndex===INTRO.length-1?'探索牌桌 →':'下一幕 →'}</button></div><div class="row between" style="margin-top:14px"><button id="replay" class="ghost">從頭重播</button><span class="small">每幕約 5 秒；讀不完可暫停</span></div></div></section></div><p class="small">${reduce?'已偵測減少動態效果偏好：不播放籌碼／翻牌位移動畫，仍可手動或自動切換解說。':'動畫為教學示意；按暫停會同時停止自動換幕與桌面動態。'}</p>`;$('#skip').onclick=finishIntro;$('#prevscene').onclick=()=>advanceIntro(-1);$('#nextscene').onclick=()=>introIndex===INTRO.length-1?finishIntro():advanceIntro(1);$('#play').onclick=()=>playing?pauseIntro():playIntro();$('#replay').onclick=()=>{pauseIntro();introIndex=0;renderIntro()};if(!playing)$$('.scene-motion').forEach(e=>e.style.animationPlayState='paused');setMotionPaused(!playing)}

function hotInfo(id){let pos={UTG:['UTG · 槍口位','翻牌前第一個行動，後面有五位玩家尚未決定；翻牌後則不是第一個。'],HJ:['HJ · Hijack','本六人桌的中位，在 UTG 後、CO 前；不同桌數會有不同命名配置。'],CO:['CO · Cutoff','BTN 前一位，通常稱後位。若 BTN 仍在局，翻牌後你不一定最後行動。'],BTN:['BTN · Button 莊家位','D 標記位於此。六人桌翻牌前後面還有 SB、BB；翻牌後通常最後行動。'],SB:['SB · Small Blind 小盲','BTN 左邊，發牌前強制投入 1（本示範盲注 1/2）。六人桌翻牌後全員在局時先行動。'],BB:['BB · Big Blind 大盲','SB 左邊，強制投入 2。1 BB＝2 籌碼；即使已付盲注，仍有行動權。']};if(pos[id])return [pos[id][0],pos[id][1],'試著切換下方行動順序，看這個座位排第幾。'];return {welcome:['點按，建立你的牌桌地圖','先點任一個座位，再找 D、兩張手牌、五張公共牌、底池與籌碼。底下的動作按鈕也都可以點。','可以自由探索；不需要依序完成。'],hole:['Hole Cards · 你的兩張手牌','只有你知道的兩張牌。一般德州撲克最後可用零、一或兩張，與公共牌組成最佳五張。','圖示：黑桃 K 與紅心 Q。'],board:['Board · 公共牌','所有玩家共用。翻牌一次三張、轉牌第四張、河牌第五張。請點下面的街次切換，觀察發牌。','牌面相同，不代表每個人的最佳五張相同。'],pot:['Pot · 底池','已投入且正在爭奪的籌碼。別把底池和自己面前剩餘的 Stack 混在一起。','底池依各座位投入加總：未自願投入時為 3；BTN 與 BB 各投入 6，加上 SB 留下的 1，形成 13。'],stack:['Stack · 面前剩餘籌碼','每人起始 200 籌碼（100 BB）；座位顯示扣除本例投入後的剩餘量，1 BB＝2 籌碼。','例如付小盲後剩 199＝99.5 BB，付大盲後剩 198＝99 BB。'],fold:['Fold · 棄牌','面對下注時可以放棄本手底池，已投入的籌碼不退回；不是退出整場活動。','此處只演示動作，不判斷你的手牌該不該棄。'],call:['Call · 跟注','假設你本街已投入 2，對手加注到 6，你只需再補 4。跟注要補的是差額，不一定是對手總額。','若剩餘籌碼不足，可全押跟注；可能產生邊池。'],raise:['Raise · 加注','假設原下注為 2，你提高到 6，就是加注到 6、增量 4。一般下一次完整加注至少到 10。','加注到 X，不等於再加 X；不足額全押另論。'],check:['Check · 過牌','沒有尚未補齊的下注時，不加新籌碼並保留牌局資格。對手仍可能下注，之後你可能需再回應。','面對下注不能以過牌跳過；但 BB 在未加注底池可能有過牌選項。'],bet:['Bet · 下注','本街還沒人下注時，由你首先投入籌碼。若對手已下注，你提高金額叫 Raise，不叫再次首次下注。','本桌底池 13，BTN 下注 4，約為 30.8% 底池下注；投入後底池為 17。'],allin:['All-in · 全押','投入自己剩餘的全部籌碼；依情境可能是下注、跟注或加注。不能因自己有更多籌碼，就從短碼玩家贏超過他可爭奪的金額。','多人邊池與重開加注權不在此入門動畫完整處理。']}[id]||['','','']}

function labIntro(k){if(k.startsWith('gto_'))return '先操作一個條件，再看它如何改變對手的選項與期望值。模型假設會隨時顯示。';return ({streets:'切換不同階段，觀察你何時能看見哪些牌。',showdown:'先猜誰贏，再揭開最佳五張；切換情境比較。',ranking:'點選牌型，查看實際五張牌，再比較踢腳牌範例。',position:'切換街次，點選位置；順序會跟著改變。',information:'先行動與後行動，決策時知道的事有什麼差別？',range:'切位置、點牌格：看範圍形狀、花色示意與組合數。',pot:'改變底池與下注，讓跟注價格變得看得見。',outs:'調整乾淨 outs 數，比較下一張與看完兩張的機率。',future:'機率與成本分開看：未來能免費看牌嗎？',action:'選一個動作，拆解它創造與放棄的選項。',raise:'改變加注總額，觀察下一次完整加注下限。',size:'同樣的數字，先確認用 BB 還是底池比例描述。',spr:'改變雙方剩餘籌碼與底池，觀察有效籌碼與 SPR。',texture:'切換公共牌，看牌面如何改變成牌與聽牌。',turn:'只換一張轉牌，重新辨識可能性。',call:'讓價格與假設勝率一起變化，比較跟注與棄牌。',bluff:'調整尺寸與假設棄牌率，觀察純詐唬的 EV。',value:'改變較差牌的占比與跟注率，與過牌基準比較。'})[k]}

function eval5(c){let rs=c.map(x=>'23456789TJQKA'.indexOf(x[0])+2).sort((a,b)=>b-a),flush=c.every(x=>x.slice(1)===c[0].slice(1)),ct={};rs.forEach(r=>ct[r]=(ct[r]||0)+1);let g=Object.entries(ct).map(([r,n])=>[n,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]),u=[...new Set(rs)],st=u.length===5&&u[0]-u[4]===4?u[0]:u.join(',')==='14,5,4,3,2'?5:0;if(flush&&st)return [8,st];if(g[0][0]===4)return [7,g[0][1],g[1][1]];if(g[0][0]===3&&g[1][0]===2)return [6,g[0][1],g[1][1]];if(flush)return [5,...rs];if(st)return [4,st];if(g[0][0]===3)return [3,g[0][1],...g.slice(1).map(x=>x[1])];if(g[0][0]===2&&g[1][0]===2)return [2,Math.max(g[0][1],g[1][1]),Math.min(g[0][1],g[1][1]),g[2][1]];if(g[0][0]===2)return [1,g[0][1],...g.slice(1).map(x=>x[1])];return [0,...rs]}
function best(c){let ans={score:[-1],cards:[]};for(let a=0;a<c.length-4;a++)for(let b=a+1;b<c.length-3;b++)for(let d=b+1;d<c.length-2;d++)for(let e=d+1;e<c.length-1;e++)for(let f=e+1;f<c.length;f++){let cs=[c[a],c[b],c[d],c[e],c[f]],s=eval5(cs);if(compare(s,ans.score)>0)ans={score:s,cards:cs}}return ans}

function drawGTO(k){const root=$('#lab');
if(k==='gto_equilibrium'){V.rock??=34;root.innerHTML=`<span class="pill">雙人零和類比 · 非 Poker 求解器</span><p>你選石頭的機率可調整，其餘機率平均分給布與剪刀。對手看得出你的長期頻率，但不知道這次的動作。</p>${slider('rock','你的石頭比例（%）',0,100,V.rock)}<div class="stats" id="rpsStrategies"></div><div class="metric" id="rpsResult"></div><div class="feedback">均衡不是「猜中對手這一次」。在這個對稱遊戲各出 1/3 時，對手不能靠單方面改策略提高收益；偏好某一招，就可能被針對。滑桿以整數顯示，34% 只是接近 1/3，不是精確均衡。</div><button id="exactRps" class="ghost">直接設為精確 1/3</button>`;const calc=()=>{let r=V.rock/100,p=(1-r)/2,sc=p;let ev=[sc-p,r-sc,p-r],bestEv=Math.max(...ev);$('#rpsStrategies').innerHTML=[['石頭',r],['布',p],['剪刀',sc]].map(([name,v])=>`<div class="stat"><span class="small">${name}</span><strong>${(v*100).toFixed(2)}%</strong></div>`).join('');$('#rpsResult').innerHTML=`對手最佳純動作：<strong>${bestEv<1e-9?'任一動作皆打平':['石頭','布','剪刀'][ev.indexOf(bestEv)]}</strong><br>對手每局最高期望淨得分：<strong>${bestEv.toFixed(3)}</strong><br><span class="small">贏＋1、輸−1、平手 0。這不是對手的獲勝機率。</span>`};bindSliders(['rock'],calc);$('#exactRps').onclick=()=>{V.rock=100/3;$('#rock').value=34;$('#rockval').textContent='33⅓';touched();calc()};return}
if(k==='gto_balance'){V.gbet??=50;V.bluffshare??=25;root.innerHTML=`<p>底池 100，下注者的範圍只有「必勝價值牌」與「必輸詐唬」。對手拿的是贏詐唬、輸價值牌的抓詐唬牌。</p>${cards(['A♠','J♥','7♦','4♣','2♠'],true)}<p class="small">牌面只裝飾情境，不由這組公共牌推算範圍。</p>${slider('gbet','下注尺寸（原底池 100）',25,200,V.gbet,25)}${slider('bluffshare','已下注範圍中的詐唬占比（%）',0,100,V.bluffshare)}<div class="bar"><div id="valueSegment" style="background:#8d9d90"></div><div id="bluffSegment" style="background:#b78e88"></div></div><p class="small">灰綠＝價值　灰粉＝詐唬。注意：分母是所有已下注的組合。</p><div id="balanceOut" class="metric"></div><button class="ghost" id="balanceTarget">設為這個尺寸的打平比例</button>`;const calc=()=>{const b=V.gbet,q=V.bluffshare/100,target=b/(100+2*b),ev=q*(100+2*b)-b;$('#valueSegment').style.width=(100-V.bluffshare)+'%';$('#bluffSegment').style.width=V.bluffshare+'%';$('#balanceOut').innerHTML=`使抓詐唬牌跟注打平的詐唬占比：<strong>${(target*100).toFixed(1)}%</strong><br>目前對手跟注 EV：<strong>${ev.toFixed(2)}</strong>；棄牌 EV：0。<br>${Math.abs(ev)<1e-7?'對手跟與棄在模型下無差異。':ev>0?'你的範圍偏多詐唬，對手跟注在此假設下有利。':'你的範圍偏少詐唬，對手棄牌優於用此抓詐唬牌跟注。'}<br><span class="small">只平衡這一方的跟注誘因，不表示已求得完整均衡。</span>`};bindSliders(['gbet','bluffshare'],calc);$('#balanceTarget').onclick=()=>{V.bluffshare=V.gbet/(100+2*V.gbet)*100;$('#bluffshare').value=V.bluffshare;$('#bluffshareval').textContent=V.bluffshare.toFixed(2);touched();calc()};return}
if(k==='gto_mixing'){V.mix??=30;V.samples??=[];root.innerHTML=`<span class="pill">人為比例練習 · 非 GTO 圖表</span><p>假設某資訊集合的兩個動作在精確均衡下具有相同 EV。這裡只練習頻率讀法，不為任何實戰牌組指定動作。</p>${slider('mix','動作 A 的長期目標比例（%）',0,100,V.mix)}<div class="metric" id="mixTarget"></div><div class="row"><button id="sampleOne" class="ghost">獨立抽一次</button><button id="sample100" class="primary">獨立抽 100 次</button><button id="clearSamples" class="ghost">清除樣本</button></div><div class="feedback" id="mixResult"></div><div class="insight">小樣本不會保證剛好等於目標。不能因為前幾次都選 A，下一次就強迫 B 來湊數。頻率不是勝率，也不是答案的可信度。</div>`;const calc=()=>{let a=V.samples.filter(x=>x).length,n=V.samples.length;$('#mixTarget').innerHTML=`A <strong>${V.mix}%</strong> ／ B <strong>${100-V.mix}%</strong>`;$('#mixResult').innerHTML=`已抽 ${n} 次：A ${a} 次、B ${n-a} 次${n?'，A 實際占 '+(a/n*100).toFixed(1)+'%':''}。<br>若修改目標比例，樣本會清空，避免把不同設定混為同一批。`};bindSliders(['mix'],()=>{V.samples=[];calc()});const sample=n=>{for(let i=0;i<n;i++)V.samples.push(Math.random()<V.mix/100);touched();calc()};$('#sampleOne').onclick=()=>sample(1);$('#sample100').onclick=()=>sample(100);$('#clearSamples').onclick=()=>{V.samples=[];touched();calc()};return}
if(k==='gto_mdf'){V.mdfbet??=50;V.defend??=66.6666667;root.innerHTML=`<p>底池 100，對方是「被防守就必輸」的零權益詐唬。簡化為防守＝跟注、沒有加注。</p>${slider('mdfbet','對方下注',25,200,V.mdfbet,25)}${slider('defend','你整體範圍防守頻率（%）',0,100,V.defend)}<div class="stats" id="mdfStats"></div><div class="feedback" id="mdfOut"></div><button class="ghost" id="setMdf">設為此模型 MDF</button><div class="insight">MDF 不是單手需要的勝率，也不告訴你用哪些牌防守。對手價值偏多時，機械跟足可能更虧；前兩街、非零權益詐唬與不同效用模型還有其他限制。</div>`;const calc=()=>{let b=V.mdfbet,d=V.defend/100,mdf=100/(100+b),q=b/(100+2*b),ev=(1-d)*100-d*b;$('#mdfStats').innerHTML=[['單手跟注門檻',q],['下注範圍詐唬占比',q],['範圍 MDF',mdf]].map(([t,v])=>`<div class="stat"><span class="small">${t}</span><strong>${(v*100).toFixed(1)}%</strong></div>`).join('');$('#mdfOut').innerHTML=`目前對手純詐唬 EV＝(1−${d.toFixed(3)})×100−${d.toFixed(3)}×${b}＝<strong>${ev.toFixed(2)}</strong>。<br>前兩格數值相同，但分母不同：一個是跟注所需權益，一個是下注範圍組成。第三格是你整體防守占比。`};bindSliders(['mdfbet','defend'],calc);$('#setMdf').onclick=()=>{V.defend=100/(100+V.mdfbet)*100;$('#defend').value=V.defend;$('#defendval').textContent=V.defend.toFixed(2);touched();calc()};return}
if(k==='gto_blockers'){V.block??=0;let known=[[],['A♠'],['K♣'],['A♠','K♣']][V.block],suits=['♠','♥','♦','♣'],aa=[],ak=[];for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){let c=['A'+suits[i],'A'+suits[j]];if(c.every(x=>!known.includes(x)))aa.push(c)}for(let i=0;i<4;i++)for(let j=0;j<4;j++){let c=['A'+suits[i],'K'+suits[j]];if(c.every(x=>!known.includes(x)))ak.push(c)}root.innerHTML=`${tabs(['無已知牌','已知 A♠','已知 K♣','你持 A♠ K♣'],V.block,'block')}<p>目前已知牌：</p>${known.length?cards(known):'<p class="small">此比較基準未移除任何牌。</p>'}<div class="stats"><div class="stat"><span class="small">AA 剩餘組合</span><strong>${aa.length}</strong></div><div class="stat"><span class="small">所有 AK 剩餘組合</span><strong>${ak.length}</strong></div><div class="stat"><span class="small">其中 AKs</span><strong>${ak.filter(c=>c[0].slice(1)===c[1].slice(1)).length}</strong></div></div><details><summary>展開：實際剩餘 AA 組合</summary><div class="comboGrid">${aa.map(c=>cards(c,true)).join('')}</div></details><details><summary>展開：實際剩餘 AK 組合</summary><div class="comboGrid">${ak.map(c=>cards(c,true)).join('')}</div></details><div class="feedback">這是實際枚舉，不是猜對手拿到哪手牌。未指定公共牌與策略範圍，也不以組合數直接當作行動後的機率。</div>`;bindTabs('block',i=>{V.block=i;touched();drawGTO(k)});return}
if(k==='gto_model'){V.model??=0;let rows=[['人數／效用','六人現金桌、以籌碼 EV 為目標','MTT 獎金壓力／ICM'],['有效籌碼','100 BB','30 BB'],['前面動作','全棄牌，輪到 CO 首次開池','UTG 已加注，輪到 CO'],['下注樹','允許 2.5 BB 開池與指定再加注尺寸','不同尺寸與可用動作'],['成本設定','指定抽水與前注','不同抽水、無抽水或不同前注']];root.innerHTML=`<span class="pill">條件對照工具 · 未運算新策略</span>${tabs(rows.map(x=>x[0]),V.model,'model')}<div class="lab"><div class="metric"><h3>資料原本的條件</h3><p>${rows[V.model][1]}</p></div><div class="metric warm"><h3>你目前的條件</h3><p>${rows[V.model][2]}</p></div></div><div class="feedback">這次只突出一項差異：${rows[V.model][0]}。條件不同，需要相符的題庫或重新求解；不能把原圖同一格視為新情境答案。尤其多人與 ICM 不可直接沿用雙人零和的不被剝削保證。</div><details open><summary>每次讀 Solver／圖表，先查這些</summary><ul><li>人數、位置、有效籌碼與完整前面動作</li><li>抽水、前注、獎金／ICM 目標</li><li>雙方範圍、下注樹與允許尺寸</li><li>求解精度、資料版本、簡化與授權來源</li></ul></details>`;bindTabs('model',i=>{V.model=i;touched();drawGTO(k)});return}
if(k==='gto_exploit'){V.exfold??=40;V.exbet??=50;root.innerHTML=`<p>底池 100，河牌純詐唬，被跟必輸。先比較明示模型，再調整假設。</p><div class="row"><button class="ghost" data-opp="25">較少棄牌：25%</button><button class="ghost" data-opp="33.3333333333">半池打平參考：33⅓%</button><button class="ghost" data-opp="60">過度棄牌示意：60%</button></div>${slider('exbet','你的下注',25,200,V.exbet,25)}${slider('exfold','假設對手棄牌率（%）',0,100,V.exfold)}<div class="metric" id="exploitOut"></div><div class="feedback">過度棄牌有可能讓更多詐唬有利；但要有可靠證據。這裡對手反應由你設定，換尺寸後真實棄牌率未必相同。少量看過的牌、只記得大底池，都可能造成誤判。</div>`;const calc=()=>{let b=V.exbet,f=V.exfold/100;$('#exploitOut').innerHTML=`此尺寸打平棄牌率 <strong>${(b/(100+b)*100).toFixed(1)}%</strong><br>對此假設對手純詐唬 EV <strong>${(f*100-(1-f)*b).toFixed(2)}</strong> 籌碼<br><span class="small">棄牌率參考按鈕不會隨下注自動重算；半池參考只有下注 50 時才打平。</span>`};bindSliders(['exbet','exfold'],calc);$$('[data-opp]').forEach(b=>b.onclick=()=>{V.exfold=+b.dataset.opp;$('#exfold').value=V.exfold;$('#exfoldval').textContent=V.exfold.toFixed(2);touched();calc()});return}
